<ion-item fill="outline" class="custom-input">
  <ion-label class="floating-label" [class.active]="isFocused">{{
    label
  }}</ion-label>
  <ion-input
    [type]="type"
    [(ngModel)]="value"
    [placeholder]="isFocused ? placeholder : ''"
    (ionFocus)="onFocus()"
    (ionBlur)="onBlur()"
    (ionInput)="onInput($event)"
  >
  </ion-input>
</ion-item>

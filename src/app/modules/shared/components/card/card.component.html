<ion-card class="news-card" [ngClass]="size" (click)="onClick()">
  <ion-img *ngIf="news.urlToImage" [src]="news.urlToImage"></ion-img>

  <ion-card-header>
    <ion-card-title>{{ news.title }}</ion-card-title>
    <ion-card-subtitle *ngIf="size === 'large'">
      {{ news.source?.name }}
    </ion-card-subtitle>
  </ion-card-header>
</ion-card>

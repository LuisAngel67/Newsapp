<ion-content>
  <ion-card class="form-container">
    <ion-card-header>
      <ion-card-title>Update Profile</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <app-user-form
        [user]="currentUser"
        [countries]="countries"
        (submitForm)="onSubmit($event)"
      ></app-user-form>
    </ion-card-content>
  </ion-card>
</ion-content>

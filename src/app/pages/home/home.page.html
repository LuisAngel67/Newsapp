<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-card *ngFor="let news of topHeadlines">
      <img *ngIf="news.urlToImage" [src]="news.urlToImage" />
      <ion-card-header>
        <ion-card-title>{{ news.title }}</ion-card-title>
      </ion-card-header>
      <ion-card-content> {{ news.description }} </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>

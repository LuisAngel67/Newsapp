<ion-card class="form-container">
  <ion-card-header>
    <ion-card-title class="form-title">Register</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <div class="container">
      <form [formGroup]="registerForm">
        <app-input
          formControlName="name"
          label="First Name"
          type="text"
        ></app-input>
        <app-input
          formControlName="lastName"
          label="Last Name"
          type="text"
        ></app-input>
        <app-input
          formControlName="email"
          label="Email"
          type="email"
        ></app-input>
        <app-input
          formControlName="password"
          label="Password"
          type="password"
        ></app-input>
        <app-input
          formControlName="confirmPassword"
          label="Confirm Password"
          type="password"
        ></app-input>
        <app-button [type]="'submit'" label="Register"></app-button>
        <ion-router-link class="link" routerLink="/login">
          Already registered?
        </ion-router-link>
      </form>
    </div>
  </ion-card-content>
</ion-card>
